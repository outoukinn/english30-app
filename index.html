height:1.75;color:#355173;margin:13px 0}.guide{font-size:14px;line-height:1.95;margin:5px 0;color:#374b66}.guide strong{color:#142641}.timerArea{background:#f2f6ff;border-radius:15px;padding:17px;margin:16px 0;text-align:center}.time{font-size:36px;font-weight:900;letter-spacing:1.4px;font-variant-numeric:tabular-nums;color:var(--navy)}.timerLabel{font-size:12px;color:var(--muted);margin-top:4px}.cardface{border:1px solid #d9e4f4;background:linear-gradient(155deg,#f9fbff,#eaf3ff);border-radius:17px;min-height:225px;padding:23px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;margin-top:16px}.english{font-size:21px;font-weight:850;line-height:1.55;overflow-wrap:anywhere}.japanese{font-size:15px;color:#435b7b;line-height:1.65}.hint{font-size:12px;color:#74819a}.wordrow{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:12px}.round{border-radius:100%;width:45px;height:45px;border:1px solid var(--border);background:white;color:var(--blue);font-size:20px}.focusline{padding:13px 15px;border-radius:11px;background:#f4f7fc;margin:10px 0}.speaker{color:#4571cb;font-weight:900;font-size:12px;margin-bottom:4px}.lineeng{font-size:15px;line-height:1.7;font-weight:650}.linejp{font-size:12px;color:var(--muted);line-height:1.7;margin-top:3px}.placeholder{font-size:14px;color:#6b7b95;text-align:center;padding:20px 3px}.prompt{background:#f3f6fb;padding:16px;border-radius:14px;margin:13px 0}.prompt .jp{font-size:15px;font-weight:800;line-height:1.65}.prompt .en{font-size:15px;line-height:1.8;color:#1c4a8b;margin-top:7px}.answerText{font-size:13px;color:#294e82;line-height:1.8;min-height:22px;padding:8px 0}.label{display:block;color:#50627e;font-size:13px;font-weight:750;margin-bottom:8px}.field{font:inherit;width:100%;border:1px solid #d5deed;border-radius:11px;padding:11px;background:white;color:var(--ink)}.readingText{font-size:15px;line-height:2.05;color:#253a56;background:#f7f9fd;padding:17 ding:14px;border-radius:13px;margin:13px 0;font-size:14px;font-weight:700}.footerAction{margin-top:18px}.contextTag{color:var(--muted);font-size:12px;margin-bottom:9px}.soundbtn{border-radius:10px;min-width:42px;min-height:37px;border:1px solid #d3dff0;color:#315fd4;background:white;font-size:13px;font-weight:750}.fixednavspace{height:10px}@media(min-width:650px){.shell{padding-left:26px;padding-right:26px}.topbar{margin-left:-26px;margin-right:-26px}.panel{padding:24px}.headtitle{font-size:28px}}

<script>
'use strict';
// 26 workplace scenarios; each week reviews the same scenario from different angles.
const COURSE = [
{t:'自己紹介とあいさつ',g:'初対面で担当業務を伝え、相手にも質問する',p:[
['Nice to meet you.','はじめまして。'],['I work in project support.','プロジェクト支援を担当しています。'],['I help coordinate schedules.','日程調整を担当しています。'],['What team are you on?','どのチームに所属していますか？'],['I am responsible for the weekly report.','週次レポートを担当しています。'],['Could you tell me about your role?','担当業務について教えていただけますか？'],['I recently joined this project.','最近このプロジェクトに参加しました。'],['I look forward to working with you.','一緒にお仕事できるのを楽しみにしています。']],d:[['A','Hi, I am Emma. Nice to meet you.'],['B','Nice to meet you, Emma. I work in project support.'],['A','What do you do on the project?'],['B','I help coordinate schedules and prepare the weekly report.'],['A','Great. I look forward to working with you.']],r:'I recently joined a project support team. My main tasks are coordinating schedules and preparing weekly reports. I work with people from several departments. I am learning how to introduce my role clearly in English.',q:['What is the speaker responsible for?','Managing a factory','Coordinating schedules and reports','Selling products',1,'日程調整とレポート作成を担当しています。']},
{t:'予定を聞く・日程調整',g:'会議の候補日時を提案し、予定を確認する',p:[
['Are you available tomorrow afternoon?','明日の午後は空いていますか？'],['Could we move the meeting to Friday?','会議を金曜日に変更できますか？'],['What time works best for you?','何時がご都合よろしいですか？'],['I have another meeting at three.','3時には別の会議があります。'],['Let me check my calendar.','予定表を確認させてください。'],['How about ten thirty?','10時30分はいかがですか？'],['I will send a calendar invitation.','カレンダー招待を送ります。'],['Please let me know if anything changes.','変更があれば教えてください。']],d:[['A','Are you available tomorrow afternoon?'],['B','Let me check my calendar. I have another meeting at three.'],['A','How about one thirty?'],['B','That works for me.'],['A','Great. I will send a calendar invitation.']],r:'Our team needs a short planning meeting this week. Several members are busy on Thursday, so we have moved the meeting to Friday at ten thirty. Everyone will receive a new calendar invitation.',q:['When is the new meeting?','Thursday afternoon','Friday at ten thirty','Monday morning',1,'金曜日の10時30分に変更されました。']},
{t:'聞き返しと確認',g:'分からない英語を止めずに聞き直す',p:[
['Could you say that again, please?','もう一度言っていただけますか？'],['Could you speak a little more slowly?','もう少しゆっくり話していただけますか？'],['What does that mean?','それはどういう意味ですか？'],['Do you mean the latest version?','最新版のことですか？'],['Let me make sure I understand.','理解が合っているか確認させてください。'],['Could you give me an example?','具体例をいただけますか？'],['Sorry, I missed the last part.','すみません、最後の部分が聞き取れませんでした。'],['Thanks for clarifying.','ご説明ありがとうございます。']],d:[['A','We need to reconcile the figures before lunch.'],['B','Sorry, I missed the last part. Could you say that again, please?'],['A','Sure. We need to check the numbers before lunch.'],['B','Got it. Thanks for clarifying.']],r:'During an online meeting, a colleague uses an unfamiliar term. You ask them to speak more slowly and give an example. They explain the term in simple words. You can then continue the discussion confidently.',q:['What does the person ask the colleague to do?','End the meeting','Use simpler words and an example','Send an invoice',1,'ゆっくり説明し、例を示してもらっています。']},
{t:'会議の基本表現',g:'会議を始め、議題を確認し、締めくくる',p:[
['Shall we get started?','始めましょうか？'],['Today we will cover three items.','今日は3項目を扱います。'],['Let us start with the first topic.','最初の議題から始めましょう。'],['Does anyone have any questions?','ご質問はありますか？'],['Could you share your thoughts?','ご意見を聞かせていただけますか？'],['We are running short on time.','時間が少なくなってきました。'],['Let us summarize the next steps.','次の対応を整理しましょう。'],['Thank you for joining today.','本日はご参加ありがとうございます。']],d:[['A','Shall we get started?'],['B','Yes, everyone is here.'],['A','Today we will cover three items. Let us start with the project schedule.'],['B','I have a question about the deadline.'],['A','Of course. Please go ahead.']],r:'The weekly meeting starts at nine. First, the team reviews the schedule. Next, each person shares updates. Finally, the team agrees on next steps. The meeting ends after thirty minutes.',q:['What happens at the end of the meeting?','The team agrees on next steps','The team hires staff','The team changes offices',0,'最後に次の対応を決めます。']},
{t:'進捗報告',g:'仕事の進み具合を簡潔に伝える',p:[
['We are on track.','予定どおり進んでいます。'],['The task is almost complete.','作業はほぼ完了しています。'],['We finished the first phase.','第一段階を終えました。'],['I am still working on the report.','レポートは引き続き作業中です。'],['There has been a small delay.','少し遅れが生じています。'],['We expect to finish by Tuesday.','火曜日までに終える見込みです。'],['I will share an update tomorrow.','明日進捗をご連絡します。'],['Nothing is blocked at the moment.','現時点で阻害要因はありません。']],d:[['A','How is the project going?'],['B','We are on track. We finished the first phase yesterday.'],['A','Is the report ready?'],['B','It is almost complete. I will share an update tomorrow.']],r:'The reporting team has finished the first phase of the project. Two tasks are still in progress, but there are no major blockers. The final report is expected by Tuesday.',q:['When is the report expected?','By Tuesday','By Friday','Next month',0,'火曜日までに完成する見込みです。']},
{t:'締切と優先順位',g:'期限を確認し、優先度を相談する',p:[
['What is the deadline for this task?','この作業の締切はいつですか？'],['This is our top priority.','これが最優先事項です。'],['Can we prioritize the urgent issues?','緊急の問題を優先できますか？'],['We need a little more time.','もう少し時間が必要です。'],['Could you finish this by Wednesday?','水曜日までに終えられますか？'],['Let us focus on the critical items.','重要な項目に集中しましょう。'],['I can take care of that first.','そちらを先に対応できます。'],['We may need to adjust the timeline.','スケジュール調整が必要かもしれません。']],d:[['A','What is the deadline for this task?'],['B','Wednesday afternoon.'],['A','We also have an urgent issue. Can we prioritize that first?'],['B','Yes, but we may need to adjust the timeline.']],r:'Two requests arrived on the same day. One is urgent because it affects tomorrow’s client meeting. The other is a routine internal update. The manager asks the team to prioritize the client request.',q:['Which task comes first?','The routine update','The urgent client request','Both next week',1,'顧客会議に関わる緊急依頼が優先です。']},
{t:'丁寧な依頼',g:'社内外に無理のない丁寧な依頼をする',p:[
['Could you take a look at this?','こちらを確認いただけますか？'],['Would you mind checking the figures?','数値をご確認いただけますか？'],['Could you send me the latest file?','最新版のファイルを送っていただけますか？'],['When you have a moment, please review it.','お時間があるときにご確認ください。'],['I would appreciate your feedback.','ご意見をいただけると幸いです。'],['Please feel free to ask questions.','遠慮なくご質問ください。'],['Would it be possible to extend the deadline?','締切を延長いただくことは可能でしょうか？'],['Thank you for your help.','ご協力ありがとうございます。']],d:[['A','Could you take a look at this report?'],['B','Sure. Is there anything specific I should check?'],['A','Would you mind checking the figures on page two?'],['B','Of course. I will get back to you this afternoon.']],r:'A project coordinator sends a report to a colleague. The report contains important figures, so she asks the colleague to review page two. She needs feedback by the end of the day.',q:['What should the colleague review?','Page two and its figures','The office address','The vacation calendar',0,'2ページ目の数値を確認してもらいます。']},
{t:'問題を報告する',g:'状況・影響・対応予定を順番に伝える',p:[
['We have identified an issue.','問題が見つかりました。'],['The system is not responding.','システムが応答していません。'],['This may affect the schedule.','スケジュールに影響する可能性があります。'],['We are investigating the cause.','原因を調査しています。'],['Here is what we know so far.','現時点で分かっていることです。'],['We have a temporary workaround.','暫定的な回避策があります。'],['I will update you as soon as possible.','分かり次第ご報告します。'],['Thank you for your patience.','お待ちいただきありがとうございます。']],d:[['A','Do you have any updates on the system issue?'],['B','We are investigating the cause.'],['A','Is the client affected?'],['B','Yes, this may affect the schedule, but we have a temporary workaround.']],r:'A reporting system stopped responding this morning. The technical team is checking the cause and has created a temporary workaround. The project manager will update the client when new information becomes available.',q:['What has the team already created?','A new contract','A temporary workaround','A marketing plan',1,'暫定回避策を準備しました。']},
{t:'理解と合意の確認',g:'認識のずれを丁寧に防ぐ',p:[
['So, just to confirm...','念のため確認ですが……'],['Are we aligned on the next steps?','次の対応について認識は一致していますか？'],['My understanding is that we start on Monday.','月曜日開始という認識です。'],['Is that correct?','その理解で合っていますか？'],['Let me repeat the main points.','要点を繰り返させてください。'],['That matches my understanding.','私の認識とも一致しています。'],['I think we may be talking about different things.','話している内容が異なるかもしれません。'],['Let us put the decision in writing.','決定事項を文章に残しましょう。']],d:[['A','My understanding is that we start on Monday. Is that correct?'],['B','Actually, the start date is Tuesday.'],['A','Thanks. Let me repeat the main points.'],['B','Yes, let us put the decision in writing.']],r:'The team initially thought a new process would start on Monday. During a meeting, they discover that the correct date is Tuesday. Everyone agrees to record the date in the meeting notes.',q:['When does the process start?','Monday','Tuesday','Thursday',1,'正しい開始日は火曜日です。']},
{t:'プロジェクトのキックオフ',g:'目的・範囲・役割を説明する',p:[
['The goal of this project is to improve efficiency.','このプロジェクトの目的は効率改善です。'],['Let us clarify the scope first.','まず対象範囲を明確にしましょう。'],['Who will be responsible for this task?','この作業の担当者は誰ですか？'],['We need to agree on the milestones.','マイルストーンの合意が必要です。'],['Here is the proposed timeline.','こちらが予定スケジュールです。'],['What are the key deliverables?','主要な成果物は何ですか？'],['We will review progress every week.','毎週進捗を確認します。'],['Please raise any concerns early.','懸念があれば早めに共有してください。']],d:[['A','The goal of this project is to improve efficiency.'],['B','What are the key deliverables?'],['A','A new workflow and a monthly dashboard.'],['B','Great. We should agree on the milestones today.']],r:'A new project aims to reduce manual reporting. The team will design a better workflow and build a monthly dashboard. Project milestones will be discussed at kickoff, and progress will be reviewed each week.',q:['What are the project deliverables?','A workflow and dashboard','A new office','A recruitment campaign',0,'業務フローと月次ダッシュボードです。']},
{t:'関係者への連絡',g:'関係部署と情報共有を進める',p:[

const KEY='business-english-30-v1';

if(!state.record||typeof state.record!=='object')state.record={};

let screen='home',cardIndex=0,showMeaning=true,showTranscript=false,showAnswer=false,selectedQ=null,micResult='',audioStatus='',listening=false,utterSession=0,timerRunning=false,timerUntil=0,timerSeconds=0,timerStage='',timerInterval=null;
function lesson(){let w=Math.floor((currentDay-1)/7),within=(currentDay-1)%7;return {pack:COURSE[w],week:w+1,within,mode:DAY_MODE[within],date:daysFrom(state.started,currentDay-1)}}
function vocabFor(l){let groups=[[0,1,2,3,4],[3,4,5,6,7],[0,2,4,6,7],[1,3,4,5,7],[0,1,5,6,7],[2,3,4,6,7],[0,1,2,3,4,5,6,7]];return groups[l.within]}
function rec(create=true){let d=lesson().date;if(!state.record[d]&&create)state.record[d]={done:{},seconds:{},quiz:null};return state.record[d]||{done:{},seconds:{},quiz:null}}

function card(name,html){return `<section class="panel">${name?`<h2 class="sectionTitle">${name}</h2>`:''}${html}</section>`}

function currentIntro(l){return `<div class="homehero"><div><span class="pill">${l.within===6?'週の復習':'今日のミッション'}</span><h2 class="sectionTitle" style="margin:10px 0 2px">${escapeHtml(l.mode.title)}</h2><p class="scenario">${escapeHtml(l.mode.tip)}</p></div></div>`}
function home(){let l=lesson();return `${daySwitch()}${card('',`${currentIntro(l)}<div class="notice">使い方：①フレーズ暗記5分 → ②英語を聞く12分 → ③声に出す10分 → ④読解・確認3分。英作文は必須にしていません。</div><button class="btn primary wide" onclick="go('${STAGES.find(s=>!rec().done[s.key])?.key||'vocab'}')">${doneCount()===4?'今日の学習をもう一度':'今日の学習を始める'}　→</button>`)}${card('今日の学習メニュー',STAGES.map((s,i)=>`<div class="chapter"><span class="number ${rec().done[s.key]?'complete':''}">${rec().done[s.key]?'✓':String(i+1)}</span><div class="chaptermain"><div class="chaptername">${s.title}</div><div class="chaptermeta">${s.min}分 · ${s.desc}</div></div><button class="chapteropen" onclick="go('${s.key}')">${rec().done[s.key]?'復習':'開く'}</button></div>`).join(''))}${card('あなたの学習プラン',`<div class="muted">EF SETの結果をもとに、<strong>聞く12分／話す10分／フレーズ暗記5分／読む3分</strong>に配分しています。全26週・180日。1週間は同じ仕事の場面を反復し、言葉を定着させる構成です。</div><div class="metricrow"><div class="metric"><strong>180</strong><span>学習日数</span></div><div class="metric"><strong>26</strong><span>週間テーマ</span></div><div class="metric"><strong>30</strong><span>1日の目標分</span></div></div>`)}${!canSave?`<div class="notice">このブラウザでは保存できません。学習記録は「記録」から書き出して保管してください。</div>`:''}`}
function stageTop(s,l){return `<div class="stepLabel"><div><span class="pill">Day ${currentDay} · ${s.min}分</span><h2 class="sectionTitle" style="margin-top:9px">${s.title}</h2></div><span class="stageBadge">${rec().done[s.key]?'✓ 完了':'未完了'}</span></div><p class="muted">${escapeHtml(l.mode.tip)}</p>`}

function timeWidget(key,min){let isCurrent=timerStage===key;let t=isCurrent?timerSeconds:min*60;return `<div class="timerArea"><div class="time" id="timer-value">${fmt(t)}</div><div class="timerLabel">目安 ${min}分 · タイマーがなくても学習できます</div><div class="btnrow" style="justify-content:center"><button class="btn secondary" onclick="toggleTimer('${key}',${min})">${isCurrent&&timerRunning?'一時停止':'タイマー開始 / 再開'}</button><button class="btn outline" onclick="resetTimer('${key}',${min})">リセット</button></div></div>`}

function vocab(){let l=lesson(),ids=vocabFor(l);cardIndex=Math.min(cardIndex,ids.length-1);let idx=ids[cardIndex],p=l.pack.p[idx],known=!!state.known[knownId(l,idx)];return `${card('',`${stageTop(STAGES[0],l)}<p class="guide"><strong>やり方：</strong> 英文を見ながら音声を聞く → 日本語を確認 → 目をそらして英語を口に出す。1枚につき3回、繰り返してください。</p>${timeWidget('vocab',5)}<div class="wordrow"><span class="mutedstrong">フレーズ ${cardIndex+1} / ${ids.length}</span><span class="pill ${known?'done':''}">${known?'覚えた':'練習中'}</span></div><div class="cardface"><div class="english">${escapeHtml(p[0])}</div><div class="japanese ${!showMeaning?'hidden':''}">${escapeHtml(p[1])}</div>${!showMeaning?'<span class="hint">日本語は非表示です</span>':''}<button class="soundbtn" onclick="sayPhrase(${idx})">▶ 英語を聞く</button></div><div class="btnrow"><button class="btn outline" onclick="toggleMeaning()">${showMeaning?'日本語を隠す':'日本語を表示'}</button><button class="btn ${known?'secondary':'outline'}" onclick="toggleKnown(${idx})">${known?'✓ 覚えた':'覚えた！'}</button></div><div class="btnrow"><button class="btn outline" onclick="moveCard(-1)" ${cardIndex===0?'disabled':''}>← 前へ</button><button class="btn secondary" onclick="moveCard(1)" ${cardIndex===ids.length-1?'disabled':''}>次へ →</button></div><div class="footerText">週内の既習フレーズ：${l.pack.p.filter((_,i)=>state.known[knownId(l,i)]).length} / 8。覚えた印はいつでも変更できます。</div>${stageDoneUI('vocab')}`)}`}

function speaking(){let l=lesson(),ids=vocabFor(l),i=ids[(l.within+1)%ids.length],p=l.pack.p[i];return `${card('',`${stageTop(STAGES[2],l)}<p class="guide"><strong>0〜3分：</strong> 会話文を音声のあとに復唱。<br><strong>3〜7分：</strong> 日本語の課題を見て、英文を見ずに答える。<br><strong>7〜10分：</strong> 自分の仕事に置き換えて1分話す。</p>${timeWidget('speak',10)}<div class="prompt"><div class="contextTag">STEP 1｜日本語を英語にする</div><div class="jp">${escapeHtml(p[1])}</div>${showAnswer?`<div class="en">${escapeHtml(p[0])}</div><button class="soundbtn" onclick="sayPhrase(${i})">▶ 模範音声</button>`:''}</div><div class="btnrow"><button class="btn secondary" onclick="toggleAnswer()">${showAnswer?'模範文を隠す':'模範文を見る'}</button><button class="btn outline" onclick="startRecognition()">🎙 話して認識</button></div><div class="answerText" id="micResult">${escapeHtml(micResult)}</div><div class="dividerSmall"></div><div class="contextTag">STEP 2｜ひとりロールプレイ</div><p class="guide">あなたは担当者です。相手から <strong>${escapeHtml(l.pack.d[0][1])}</strong> と言われました。20〜30秒で英語で返答してください。</p><button class="soundbtn" onclick="sayDialogueLine(0)">▶ 相手のセリフを聞く</button><div class="dividerSmall"></div><div class="contextTag">STEP 3｜自分の仕事に置き換える</div><p class="guide">「${escapeHtml(l.pack.g)}」を、実際の業務や直近の予定に当てはめて30〜60秒説明しましょう。詰まったら今週のフレーズ8個から使えそうなものを選んでください。</p><div class="notice">声に出せたかどうかを自分で確認する練習です。音声認識は対応ブラウザでのみ使えます。認識できなくても、声に出した練習は有効です。</div>${stageDoneUI('speak')}`)}`}
function reading(){let l=lesson(),q=l.pack.q;return `${card('',`${stageTop(STAGES[3],l)}<p class="guide"><strong>やり方：</strong> 英文を1回読む → 3択で内容を確認 → 正解と説明をチェック。わからない語があっても、まず全体の意味をつかみます。</p>${timeWidget('read',3)}<div class="readingText">${escapeHtml(l.pack.r)}</div><div class="contextTag">理解度チェック</div><p class="guide" style="font-weight:800">${escapeHtml(q[0])}</p>${[1,2,3].map((n,i)=>`<button class="opt ${selectedQ===i?'selected':''} ${selectedQ!==null&&i===q[4]?'right':''} ${selectedQ===i&&i!==q[4]?'wrong':''}" onclick="pickAnswer(${i})">${'ABC'[i]}．${escapeHtml(q[n])}</button>`).join('')}${selectedQ===null?'':`<div class="result"><strong>${selectedQ===q[4]?'✓ 正解です':'もう一度確認しましょう'}</strong><br>${escapeHtml(q[5])}</div>`}<div class="btnrow"><button class="btn outline" onclick="sayReading()">▶ 英文を聞く</button><button class="btn secondary" onclick="resetQuiz()">もう一度答える</button></div>${stageDoneUI('read')}`)}`}
function logs(){let today=jpToday(),rows=Object.keys(state.record).sort().reverse(),finished=rows.filter(d=>STAGES.every(s=>state.record[d]?.done?.[s.key])),watched=rows.filter(d=>Object.keys(state.record[d]?.done||{}).some(k=>state.record[d].done[k]));let streak=0;for(let i=0;i<180;i++){let d=daysFrom(today,-i);if(STAGES.every(s=>state.record[d]?.done?.[s.key]))streak++;else if(i===0)continue;else break}return `${card('学習の記録',`<p class="muted">学習の完了状況はこの端末のブラウザ内に保存されます。</p><div class="metricrow"><div class="metric"><strong>${finished.length}</strong><span>30分メニュー完了日</span></div><div class="metric"><strong>${watched.length}</strong><span>学習した日</span></div><div class="metric"><strong>${streak}</strong><span>連続完了日</span></div></div><div class="dividerSmall"></div><h3 style="font-size:15px">直近の学習</h3>${rows.length?rows.slice(0,30).map(d=>{let r=state.record[d],n=STAGES.filter(s=>r.done[s.key]).length,sec=Object.values(r.seconds||{}).reduce((a,b)=>a+(Number(b)||0),0);return `<div class="logrow"><div><div class="date">${escapeHtml(d)}</div><div class="muted tiny">${Math.round(sec/60)}分計測${r.quiz!==null?' · 理解チェック回答済み':''}</div></div><div class="pill ${n===4?'done':''}">${n}/4 メニュー</div></div>`}).join(''):'<p class="muted">まだ記録がありません。今日の学習を始めましょう。</p>'}<div class="footerText">タイマーで計測した時間だけを「計測分」として表示します。メニュー完了は時間ではなく完了ボタンで記録されます。</div>`)}${card('記録のバックアップ',`<p class="muted">機種変更・ブラウザのデータ消去に備えて、定期的にバックアップしてください。</p><div class="btnrow"><button class="btn secondary" onclick="exportData()">↓ 記録を書き出す</button><button class="btn outline" onclick="document.getElementById('importFile').click()">↑ 記録を取り込む</button></div><input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importData(event)"><p class="footerText">取り込むと現在の学習記録を上書きします。</p>`)}`}
function settings(){return `${card('学習の設定',`<div class="fieldset"><label class="label" for="dateStart">Day 1 の開始日（日本時間）</label><input type="date" id="dateStart" class="field" value="${escapeHtml(state.started)}" min="2020-01-01" max="2100-12-31"><button class="btn secondary" onclick="saveStart()">開始日を変更</button></div><hr><div class="fieldset"><label class="label" for="rate">英語音声の速度：<strong id="rateValue">${Number(state.voiceRate).toFixed(2)}倍</strong></label><input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${state.voiceRate}" oninput="changeRate(this.value)"><button class="btn outline" onclick="say('Could you share the latest update, please?')">▶ 速度を試す</button></div><hr><label class="checkboxrow"><input type="checkbox" ${state.autoMeaning?'checked':''} onchange="state.autoMeaning=this.checked;save()"><span>フレーズの日本語を最初から隠す</span></label><p class="footerText">目標は半年で仕事の会話に慣れること。文法の長い解説やゲーム機能は入れず、暗記・聞く・話すを中心にしています。</p>`)}${card('データ・利用上の注意',`<p class="muted">アカウント登録・課金・広告は不要です。端末内保存のため、別の端末には自動同期されません。音声読み上げは端末の機能に依存し、音声認識は対応端末とマイク権限が必要です。</p><div class="btnrow"><button class="btn secondary" onclick="exportData()">バックアップ保存</button><button class="btn danger" onclick="resetAll()">学習記録を初期化</button></div>`)}${card('学習内容',`<p class="muted">第1〜9週：基本会話・予定・報告。第10〜17週：PMO・要件・データ・オンライン会議。第18〜26週：提案・調整・顧客対応・総合演習。<br><br>各週は8表現＋会話＋短い英文。7日間で聞き取れる・即答できる状態を目指します。毎日の教材はアプリ内に収録済みです。</p>`)}`}
function render(){let l=lesson();let main=screen==='home'?home():screen==='vocab'?vocab():screen==='listen'?listen():screen==='speak'?speaking():screen==='read'?reading():screen==='logs'?logs():settings();$('#app').innerHTML=titleHeader(l)+`<div style="margin-top:19px">${main}</div><div class="fixednavspace"></div>`;let nav=[['home','⌂','ホーム'],['vocab','▤','フレーズ'],['listen','♫','聞く'],['speak','◉','話す'],['read','✓','確認'],['logs','▥','記録'],['settings','⚙','設定']];$('#tabs').innerHTML=nav.map(([id,ic,t])=>`<button class="tab ${screen===id?'active':''}" onclick="go('${id}')" aria-label="${t}"><span class="sym">${ic}</span><span>${t}</span></button>`).join('');if(timerStage&&timerRunning)updateTimerText()}

function resetQuiz(){selectedQ=null;rec().quiz=null;save();render()}
function completeStage(key){let r=rec();r.done[key]=true;if(timerStage===key){pauseTimer();r.seconds[key]=Math.max(r.seconds[key]||0,STAGES.find(s=>s.key===key).min*60-timerSeconds)}save();let ix=STAGES.findIndex(s=>s.key===key);go(ix===STAGES.length-1?'home':STAGES[ix+1].key)}
function updateTimerText(){if(!timerRunning)return;timerSeconds=Math.max(0,Math.ceil((timerUntil-Date.now())/1000));let el=$('#timer-value');if(el)el.textContent=fmt(timerSeconds);if(timerSeconds<=0){pauseTimer();try{navigator.vibrate?.(100)}catch(e){}}}
function toggleTimer(key,min){if(timerRunning&&timerStage===key){pauseTimer();return}if(timerStage!==key){timerStage=key;timerSeconds=min*60}timerUntil=Date.now()+timerSeconds*1000;timerRunning=true;clearInterval(timerInterval);timerInterval=setInterval(updateTimerText,250);render()}
function pauseTimer(){if(timerRunning)timerSeconds=Math.max(0,Math.ceil((timerUntil-Date.now())/1000));timerRunning=false;clearInterval(timerInterval);renderTimerBtn()}
function renderTimerBtn(){let el=$('#timer-value');if(el)el.textContent=fmt(timerSeconds)}
function resetTimer(key,min){pauseTimer();timerStage=key;timerSeconds=min*60;render()}
function voice(){let list=window.speechSynthesis?.getVoices?.()||[];return list.find(v=>v.lang==='en-US'&&!v.name.toLowerCase().includes('compact'))||list.find(v=>v.lang?.toLowerCase().startsWith('en'))||null}
function stopAudio(clear=true){utterSession++;listening=false;try{speechSynthesis.cancel()}catch(e){}if(clear)audioStatus='';let el=$('#audioState');if(el)el.textContent=audioStatus}
function speakOne(text,token,onEnd){if(!('speechSynthesis'in window)){audioStatus='この環境では音声読み上げが使えません。';let el=$('#audioState');if(el)el.textContent=audioStatus;return}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number(state.voiceRate)||.84;let v=voice();if(v)u.voice=v;u.onend=()=>{if(token===utterSession&&onEnd)onEnd()};u.onerror=()=>{if(token===utterSession){audioStatus='音声を再生できませんでした。端末の音量・設定をご確認ください。';let el=$('#audioState');if(el)el.textContent=audioStatus}};speechSynthesis.speak(u)}
function say(text){stopAudio();const token=utterSession;speakOne(text,token)}
function sayPhrase(i){say(lesson().pack.p[i][0])}
function sayDialogueLine(i){say(lesson().pack.d[i][1])}
function sayReading(){say(lesson().pack.r)}
function playDialogue(repeats=1){stopAudio();const token=utterSession,dialog=lesson().pack.d;let n=0,total=dialog.length*repeats;listening=true;function next(){if(token!==utterSession)return;if(n>=total){listening=false;audioStatus='再生が終了しました。';let el=$('#audioState');if(el)el.textContent=audioStatus;return}audioStatus=`再生中 ${n+1}/${total} 文`;let el=$('#audioState');if(el)el.textContent=audioStatus;let line=dialog[n%dialog.length][1];n++;speakOne(line,token,next)}next()}
function startRecognition(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){micResult='このブラウザは音声認識に対応していません。声に出して練習してください。';let el=$('#micResult');if(el)el.textContent=micResult;return}try{let r=new R();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;micResult='マイクに向かって英語を話してください…';$('#micResult').textContent=micResult;r.onresult=e=>{micResult='認識された英語：'+e.results[0][0].transcript;let el=$('#micResult');if(el)el.textContent=micResult};r.onerror=e=>{micResult='音声認識を利用できませんでした（'+e.error+'）。声に出す練習は続けられます。';let el=$('#micResult');if(el)el.textContent=micResult};r.start()}catch(e){micResult='この環境ではマイクを起動できません。';$('#micResult').textContent=micResult}}
function saveStart(){let newDate=$('#dateStart').value;if(!/^\d{4}-\d\d-\d\d$/.test(newDate)){alert('正しい日付を入力してください。');return}state.started=newDate;save();currentDay=Math.max(1,Math.min(180,dayDiff(state.started,jpToday())+1));go('home')}
function changeRate(val){state.voiceRate=Number(val);$('#rateValue').textContent=Number(val).toFixed(2)+'倍';save()}
function exportData(){let txt=JSON.stringify({format:'business-english-30-v1',savedAt:new Date().toISOString(),state},null,2);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='english30-backup-'+jpToday()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!=='business-english-30-v1'||!obj.state?.record||!obj.state?.started)throw Error('形式が違います');if(!confirm('現在の記録をバックアップの内容で上書きしますか？'))return;state=obj.state;save();currentDay=Math.max(1,Math.min(180,dayDiff(state.started,jpToday())+1));go('home');alert('記録を取り込みました。')}catch(err){alert('取り込みに失敗しました。English 30 のバックアップJSONを選んでください。')}finally{e.target.value=''}}
function resetAll(){if(!confirm('すべての学習記録を初期化します。よろしいですか？'))return;if(!confirm('本当に初期化しますか？この操作は元に戻せません。'))return;state={started:jpToday(),record:{},known:{},voiceRate:.84,listenRepeat:1};save();currentDay=1;go('home')}
showMeaning=!state.autoMeaning;
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
render();
</script>
</body>
</html>
